<!DOCTYPE html>
<html lang="en">
<head>
    <title>Cylon Brew caffe contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h3>Ceylon Brew</h3>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="menu.html">Menu</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
</header>

<main>
    <main style="padding:20px;">
  <h2>Contact Us</h2>

  <form>
    <fieldset>
      <h3>Your Details</h3>
      <label>Full Name</label>
      <input type="text" required>

      <label>Email*</label>
      <input type="email" required>

      <label>Phone</label>
      <input type="tel">
      </fieldset>

      <fieldset>
      <legend>Booking</legend>
      <label>Preferred Drink</label>
      <select>
        <option>Latte</option>
        <option>Cappuccino</option>
        <option>Espresso</option>
        <option>Tea</option>
        </select>

      <label>Visit Date</label>
      <input type="date">

      <label>Table Size</label>
      <input type="radio" name="size" style="width:auto;"> Small
      <input type="radio" name="size" style="width:auto;"> Medium
      <input type="radio" name="size" style="width:auto;"> Large
      </fieldset>

   
</main>
<footer>
  <p> 2026 Ceylon Brew</p>
</footer>

</body>
</html>
